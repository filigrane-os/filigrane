# keyd: internal US keyboard of the T2 Macs. Installed in /etc/keyd/default.conf by hardware/mac-t2/setup.sh (--only keys).
# No remapping: Command stays Super (the Mod key of niri), copy/paste = Ctrl+C/V. keyd keeps the keyboard
# captured for the Touch Bar driver (appletb v2).

[ids]
# Internal keyboard only. The trackpad has the same USB identifier (05ac:027e) and keyd also classifies it
# as a keyboard (buttons): capturing it breaks multitouch. The 3rd field (see `keyd monitor`)
# is computed by keyd from the capabilities and the name of the device, stable between boots:
# f2d1f5c2 = keyboard, c772a57c = trackpad. To check again if the trackpad is captured again.
k:05ac:027e:f2d1f5c2

[main]
