# 13" 2020 Intel MacBook Pro (MacBookPro16,2): same chassis and same 4 speakers as the
# 13" M1 MacBook Pro (j293). We apply the Asahi DSP (asahi-audio: FIR measured against macOS,
# bankstown for the bass, loudness compensation, LSP limiters) on the T2 output.
# Installed by hardware/mac-t2/setup.sh (--only audio) on these models only.
node.software-dsp.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__Speaker__sink$" }
    ]
    actions = {
      create-filter = {
        filter-path = "/usr/share/t2-audio/speakers-j293.json"
        hide-parent = true
      }
    }
  }
]

# The software-dsp script is not loaded by default
wireplumber.profiles = {
  main = {
    node.software-dsp = required
  }
}
