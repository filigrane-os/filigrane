
# filigrane: headset microphone on the 3.5 mm jack (PCM 3, "Codec Input").
# Upstream t2bce profiles leave it out, so PipeWire never shows it. The driver
# only reports the output jack: the mic follows it and takes over the internal
# microphone while something is plugged in (as on macOS).
# Appended to every AppleT2/HiFi-x*.conf by hardware/mac-t2/setup.sh.
SectionDevice."Headset" {
	Comment "Headset Microphone"

	Value {
		CapturePriority 400
		CaptureChannels 1
		CaptureRate 48000
		CapturePCM "hw:${CardId},3"
		JackControl "Codec Output Jack"
	}
}
