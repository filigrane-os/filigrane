# T2 Mac: the headphones come before the speakers when plugged in.
# The "Speaker" filter (UCM split) has priority.session 1000, the headphones 712: without this rule,
# the output stays on the speakers. With the headphones unplugged, their route is unavailable and
# WirePlumber goes back to the speakers.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = {
        priority.session = 1100
        priority.driver  = 1100
      }
    }
  }
]
