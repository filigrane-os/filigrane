[package]
name = "fili-file"
version = "1.0.0"
edition = "2024"
description = "Casier (fili-file): a fast file manager for Wayland desktops, written in Rust with a Qt Quick interface"
license = "GPL-3.0-or-later"
repository = "https://github.com/filigrane-os/fili-file"
readme = "README.md"
keywords = ["file-manager", "wayland", "qt"]
categories = ["gui"]

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
libc = "0.2.191"
zbus = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
cxx-qt-build = "0.10.0"
