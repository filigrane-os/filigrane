[package]
name = "fili-cal"
version = "0.1.0"
edition = "2024"
description = "Calendar and reminders of Filigrane: one list of events (an iCalendar file each), alarms, no daemon"
license = "GPL-3.0-or-later"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
