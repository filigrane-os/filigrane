[package]
name = "fili-appmenu"
version = "0.1.0"
edition = "2024"
description = "Menu de l'application active pour la fili-bar: lit la barre de menus par AT-SPI, déclenche un item"
license = "Apache-2.0"

[dependencies]
zbus = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
