[package]
name = "fili-incident"
version = "0.1.0"
edition = "2024"
description = "Problems reported by the fili-* applications: notification, Rob, and a GitHub issue prepared (or a +1 on the existing one)"
license = "GPL-3.0-or-later"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
