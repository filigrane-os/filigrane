[package]
name = "fili-music"
version = "0.1.0"
edition = "2024"
description = "Baladeur (fili-music): the music player of Filigrane, a Qt Quick window on tornade-core"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
libc = "0.2.191"
serde_json = "1"
env_logger = "0.11"
log = "0.4"
zbus = "5"
# The core of the Tornade player (MIT). The branch makes its FFI entry points `pub`; it moves to `main` once merged there.
tornade-core = { git = "https://github.com/tornade-player/tornade-core", branch = "expose-ffi-rust-api" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
cxx-qt-build = "0.10.0"
