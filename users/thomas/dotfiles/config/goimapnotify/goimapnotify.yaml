# IMAP IDLE listening on the local Proton bridge (protonmail-bridge --noninteractive, port 1143, self-signed STARTTLS).
# Credentials in the keyring (nothing in the repository):
#   secret-tool store --label="Proton bridge user" service proton-bridge-user
#   secret-tool store --label="Proton bridge pass" service proton-bridge-pass
# The connectivity check targets the local bridge (default ubuntu.com:80, unreachable over IPv6 here)
connectivityHosts:
  - 127.0.0.1:1143
networkCheckInterval: 120
configurations:
  - host: 127.0.0.1
    port: 1143
    tls: false
    tlsOptions:
      starttls: true
      rejectUnauthorized: false
    usernameCMD: "secret-tool lookup service proton-bridge-user"
    passwordCMD: "secret-tool lookup service proton-bridge-pass"
    boxes:
      - mailbox: INBOX
        onNewMail: "$HOME/.local/bin/mail-notify"
        onNewMailPost: SKIP
