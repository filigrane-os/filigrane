<?xml version="1.0" encoding="UTF-8"?>
<!-- Cassette (fili-recorder), a Walkman cassette in the Filigrane colours: night body, veil label, slate reels, sand tape and mark -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <title>Cassette</title>
  <!-- body -->
  <rect x="6" y="16" width="84" height="64" rx="9" fill="#232b36" stroke="#3c4858" stroke-width="2"/>
  <!-- label -->
  <rect x="13" y="22" width="70" height="38" rx="4" fill="#9dbbd6" stroke="#3c4858" stroke-width="1"/>
  <path d="M19 29h32M19 35h22" stroke="#5f7894" stroke-width="3" stroke-linecap="round"/>
  <rect x="63" y="25" width="14" height="7" rx="2" fill="#d2bf92" stroke="#3c4858" stroke-width="1"/>
  <!-- tape window with its two reels and the tape between them -->
  <rect x="25" y="40" width="46" height="16" rx="8" fill="#1c222b" stroke="#3c4858" stroke-width="1.5"/>
  <path d="M36 54.5h24" stroke="#d2bf92" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="36" cy="48" r="6" fill="#5f7894" stroke="#3c4858" stroke-width="1"/>
  <circle cx="60" cy="48" r="6" fill="#5f7894" stroke="#3c4858" stroke-width="1"/>
  <circle cx="36" cy="48" r="2.4" fill="#1c222b"/>
  <circle cx="60" cy="48" r="2.4" fill="#1c222b"/>
  <path d="M36 45.6v-1.2M36 50.4v1.2M33.9 46.8l-1-.6M38.1 49.2l1 .6M33.9 49.2l-1 .6M38.1 46.8l1-.6M60 45.6v-1.2M60 50.4v1.2M57.9 46.8l-1-.6M62.1 49.2l1 .6M57.9 49.2l-1 .6M62.1 46.8l1-.6" stroke="#9dbbd6" stroke-width="0.8" stroke-linecap="round"/>
  <!-- foot of the cassette -->
  <path d="M20 80l5-15h46l5 15z" fill="#1c222b" stroke="#3c4858" stroke-width="1.5" stroke-linejoin="round"/>
  <circle cx="36" cy="73" r="3" fill="#232b36" stroke="#5f7894" stroke-width="1.2"/>
  <circle cx="60" cy="73" r="3" fill="#232b36" stroke="#5f7894" stroke-width="1.2"/>
  <!-- screws -->
  <circle cx="11" cy="21" r="1.6" fill="#5f7894"/>
  <circle cx="85" cy="21" r="1.6" fill="#5f7894"/>
  <circle cx="11" cy="75" r="1.6" fill="#5f7894"/>
  <circle cx="85" cy="75" r="1.6" fill="#5f7894"/>
</svg>
