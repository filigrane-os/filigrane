<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Thin interface icons (fili-bar, fili-notification, fili-launcher): behind Jost, "Fili Icons"
     (Lucide on the Font Awesome codes, scripts/fili-icons.py) comes before Font Awesome and the Nerd Fonts.
     Limited to Jost: the terminal (JetBrains Mono) keeps the Nerd Font icons. -->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>Jost</string></test>
    <edit name="family" mode="append" binding="strong"><string>Fili Icons</string></edit>
  </match>
</fontconfig>
