<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- A single interface font (hig.md, Typography): Jost becomes the system's sans-serif and system-ui font, so
     that third-party applications (Chrome, GTK, Qt) that follow fontconfig match the fili-shell. Sites and
     applications that ask for a specific font keep it; code and terminals use JetBrains Mono (monospace). -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Jost</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Jost</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
</fontconfig>
