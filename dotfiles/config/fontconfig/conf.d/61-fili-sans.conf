<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Code and terminals use JetBrains Mono (monospace). The sans-serif and system-ui aliases (the interface font,
     Jost by default, hig.md Typography) are generated by fili-theme into 62-fili-font.conf from [theme] font of
     ~/.config/filigrane/theme.toml, so that third-party applications (Chrome, GTK, Qt) follow the fili-shell. -->
<fontconfig>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
</fontconfig>
