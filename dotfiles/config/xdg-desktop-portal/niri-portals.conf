# The FileChooser of xdg-desktop-portal-gnome requires Nautilus (not installed):
# without it, Chromium cancels "Save as" downloads. We go through gtk.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
# fili-file answers Open / Save (Chrome...), the gtk dialog is the backup
org.freedesktop.impl.portal.FileChooser=filigrane;gtk;
