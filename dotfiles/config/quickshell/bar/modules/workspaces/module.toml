# fili-bar module manifest (see docs/bar.md)
title = "Workspaces"
description = "niri workspaces"
side = "left"
order = 20
# Off by default: the workspaces are the strip at the left of the taskbar (bar/FiliTaskbar.qml). Set [modules.workspaces] enabled = true
# in fili-bar.toml to have them in the fili-bar again (for example with [taskbar] enabled = false)
enabled = false
