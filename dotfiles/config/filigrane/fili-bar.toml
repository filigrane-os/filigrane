# Settings of the fili-bar (the bar of the desktop). Everything is optional: commented lines show the defaults.
# The bar re-reads this file as soon as it changes. The same choices are in the right click menu of the bar and in
# Settings > Bar, and `fili-bar` (edge, screens, enable, disable, move) writes them here.
# Your own choices belong to the personal layer: users/<login>/dotfiles/config/filigrane/fili-bar.toml replaces this file.

[bar]
# Edge of the screen the bar sits on: "top", "bottom", "left" or "right".
# On the left and the right the bar is a narrow column: modules stack, the application menu folds into one button,
# the clock shows the time over the date.
# edge = "top"

# Screens that get a bar: "all", or a list of output names (see `niri msg outputs`, or Settings > Display).
# Example: screens = ["eDP-1"] (laptop screen only), screens = ["DP-6", "DP-7"].
# If none of the listed screens is connected, every screen gets a bar, so the bar never disappears.
# screens = "all"

# The modules. A module is a folder of bar/modules/ (<name>/<Name>Module.qml); its module.toml gives its default side
# and order. Default rows: the manifests sorted by order, left = logo, appmenu (workspaces is off, see the tasks bar); right = the others.
# An explicit list is the exact order of the row, left to right, and wins over `order`. "..." stands for the default
# modules of the row that are not listed yet, so a module of yours can join without restating the rest.
# [modules]
# left  = ["logo", "workspaces", "appmenu"]
# right = ["mail", "...", "clock", "power"]

# Per-module overrides of the manifest: [modules.<name>].
# [modules.clock]
# side = "left"       # "left" or "right": the row (the top or the bottom of a column)
# order = 5           # position in the row, smaller = first (more to the left)
# enabled = false     # false removes the module (also from the lists above)
# display = "icon"    # "both" (default), "icon" (the icon alone) or "value" (the value alone)
# tray = "idle"       # drawer: "never" (default, always in the bar), "idle" (in the bar only while it has something to
#                     # say, in the drawer at rest) or "always" (only in the open drawer)
# show = "always"     # "active" (default, hidden while empty) or "always"
# compact_at = 2      # squeeze level (1-4) from which the module shows its compact form (icon alone, clock without the date)
# drawer_at = 3       # squeeze level from which the module moves into the drawer (0 = never)

# The tasks bar: every window of a screen, grouped by workspace (docs/bar.md, "The tasks bar").
# [tasks]
# enabled = true      # false: no tasks bar
# edge = "bottom"     # "bottom" or "top" (the edge of the fili-bar is never shared: the tasks bar takes the other one)
# screens = "all"     # "all", or a list of output names
