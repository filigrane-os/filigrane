# Réglages de fili-file (explorateur). Tout est facultatif: les lignes commentées montrent les défauts.
# Lu à chaque ouverture de fenêtre. Ce que tu changes à la main dans l'application (vue, colonnes)
# est gardé dans ~/.local/state/filigrane/ et passe devant ce fichier.

# Présentation au premier lancement: "list" ou "grid"
# view = "list"

# Afficher les fichiers cachés
# show_hidden = false

# Boutons « Fermer » et « Fenêtre » (actions niri) à droite de l'en-tête. Le menu Présentation > Afficher les boutons de fenêtre
# passe devant ce réglage
# window_buttons = true

# Tri: name, size, date, kind, created, permissions, owner
# sort = "name"
# sort_desc = false

# Colonnes de la vue en liste (parmi les mêmes clés que le clic droit sur l'en-tête)
# columns = "size,modified"

# Dossier ouvert sans argument (défaut: le dossier personnel)
# start = "~"

# Réception de fichiers (LocalSend, Bluetooth; menu Fichier > Recevoir…)
# Dossier où ils arrivent (défaut: Téléchargements)
# receive_dir = "~/Downloads"

# "ask": une notification Accepter / Refuser à chaque envoi; "always": tout accepter tant que la réception est activée
# receive_confirm = "ask"

# Couper la réception après ce nombre de minutes (0: jusqu'à ce que tu la coupes)
# receive_minutes = 0

# Nom sous lequel cet ordinateur apparaît chez les autres appareils (LocalSend)
# receive_name = "FILIGRANE"

# Monter tout seul les clés USB, cartes SD et disques externes à leur branchement (programme fili-automount, lancé avec la session)
# automount = true

# Thème (couleurs, rayons, bordures, espacements, polices), en anglais, par mode clair / sombre.
# Les défauts sont dans fili-file/theme.toml (toutes les clés y sont commentées). Ajouter ici seulement ce qui change:
# [theme]               # les deux modes
# radius_control = 8
# border_width = 1
# [theme.dark]
# background = "#101418"
# [theme.light]
# accent = "#336699"
# [theme.accents]       # teintes pour `fili-theme accent <nom>`: [sombre, sombre vif, clair, clair vif]
# sauge = ["#a3bfa8", "#bcd3c0", "#4a7354", "#385a42"]
# Pour changer toutes les applications Filigrane d'un coup: ~/.config/filigrane/theme.toml (mêmes sections);
# ce fichier-ci passe devant.
