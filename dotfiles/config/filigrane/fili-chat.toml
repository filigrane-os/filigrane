# fili-chat (le chat de la fili-bar). Le menu View de la fili-bar (chat ouvert) change le mode et la largeur;
# ce choix est gardé dans ~/.local/state/filigrane/chat-view et passe devant ce fichier (le supprimer pour revenir ici).

# dock: à droite de chaque fenêtre (elles se rétrécissent). float: au-dessus des fenêtres, sans les toucher.
mode = "dock"

# Largeur en pixels (300 à 900)
width = 440

# Reprise de la session liée à l'application active, à l'ouverture du chat seulement.
# app: une session par application (créée en écrivant avec la note de contexte). window: par application et titre de
# fenêtre. off: pas de lien, le chat rouvre la dernière session.
follow = "app"
