# Filigrane (brand.md): night background, mist text, veil accent, desaturated state colors. Light mode (fili-theme):
# paper, night text, slate accent, darkened states. fili-theme switches the open windows (SIGUSR1/SIGUSR2)
[main]
# Theme of new windows (initial-color-theme) and cursor in the accent color, written by fili-theme
include=~/.config/foot/theme.ini
font=JetBrains Mono:pixelsize=12
pad=10x10
# No extra render threads (less RAM and CPU)
workers=0
# Selecting text also copies it to the clipboard (Ctrl+V / Ctrl+Shift+V)
selection-target=both

[colors-dark]
