[key-bindings]
# Universal copy/paste (Cmd+C/V through keyd, see hardware/mac-t2/keyd.conf), like Omarchy
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste
primary-paste=none
