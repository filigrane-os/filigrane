# iwd configures the Wi-Fi IP itself (DHCPv4, RA/DHCPv6, DNS through resolvconf).
# The address follows each connection: no more stale lease when dhcpcd misses the disconnection
# (reconnection in under a second on wake from sleep, to another network).
# dhcpcd only handles the wired link now (denyinterfaces wl* in /etc/dhcpcd.conf).
[General]
EnableNetworkConfiguration=true

[Network]
NameResolvingService=resolvconf
