# zramen (/etc/sv/zramen/conf): compressed swap in RAM, with priority over the SSD swapfile.
# zstd compresses ~3:1: 50 % of the RAM (8 GB cap) in zram only takes ~2-3 GB once full.
# The swapfile /swap/swapfile stays as overflow (priority -2), without hibernation (nohibernate).
export ZRAM_COMP_ALGORITHM=zstd
export ZRAM_SIZE=50
export ZRAM_MAX_SIZE=8192
export ZRAM_PRIORITY=32767
export ZRAMEN_QUIET=1
