# Light hardening for a client machine (no effect on rootless podman or on the VPN)
# Kernel log and kernel addresses reserved to root (dmesg: as root)
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
# Unprivileged eBPF refused
kernel.unprivileged_bpf_disabled = 1
# Source address anti-spoofing, in loose mode (2) so as not to disturb the VPN or multiple interfaces
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
# No ICMP redirects accepted or sent; no source routing
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.tcp_syncookies = 1

# Swap: zram (compressed RAM) first, SSD swapfile as overflow. Swapping to zram costs
# little: a high value frees the RAM of inactive pages (default 60, 10 without zram)
vm.swappiness = 100
